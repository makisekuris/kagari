model:
  base_url: "" # Your Responses-compatible base URL, including /v1 when needed.
  name: "" # Model ID provided by your endpoint.
  # Use KAGARI_MODEL_API_KEY for the credential.
  timeout: 60s
  max_output_tokens: 5000

storage:
  path: data/kagari.db

telegram:
  # Use KAGARI_TELEGRAM_TOKEN for the credential.
  allowed_user_ids: [] # Set exactly one positive Telegram user ID for personal mode.
  target_chat_ids: [] # Must stay empty for `kagari run`; replies go to the owner's private chat.

personal:
  channel: telegram # telegram or weixin; switching requires a restart.
  task_concurrency: 4
  task_budget: 30m # Cumulative execution time per Task, including automatic planning; waiting is excluded.

profile_path: profile.md
log_level: info # V2 terminal level; file logs retain info+ and legacy CLI behavior is unchanged.
max_attempts: 6 # Includes the first attempt; at most five retries.

logging:
  directory: "" # Empty uses kagari.logs beside storage.path; full payloads are logged after known credentials are redacted.
  rotate_mib: 50
  max_total_mib: 1024
  retention_days: 7 # Rotated files are removed when they exceed this total-size cap or age limit.

reader:
  timeout: 20s
  max_bytes: 4194304
  max_content_chars: 20000
  max_links: 40
  cache_ttl: 24h
  allowed_non_public_cidrs: [] # e.g. [198.18.0.0/16] for a TUN fake-IP range.

browser:
  enabled: false # Exposes browse_url to the model when enabled.
  command: npx # Playwright MCP executable; no shell is used.
  args: [-y, "@playwright/mcp@0.0.82", --headless, --isolated, --codegen, none]

agent:
  max_sources: 6
  max_iterations: 10
  timeout: 3m
  streaming: false # Enables Responses SSE for analysis and weekly digests; per-chunk SSE logs are disabled.

weekly:
  enabled: false # Legacy reading service setting; personal mode does not schedule digests.
  timezone: Asia/Shanghai
  weekday: 1 # 0=Sunday, 1=Monday, ..., 6=Saturday.
  time: "09:00"
  max_input_chars: 120000 # Serialized weekly input cap; oversized input fails without dropping entries.
