model:
  base_url: "" # Your Responses-compatible base URL, including /v1 when needed.
  name: "" # Model ID provided by your endpoint.
  # Use KAGARI_MODEL_API_KEY for the credential.
  timeout: 60s
  max_output_tokens: 5000

storage:
  path: data/kagari.db

telegram:
  # Use KAGARI_TELEGRAM_TOKEN for the credential.
  allowed_user_ids: []
  target_chat_ids: [] # e.g. [123456789, -1001234567890] sends to your private chat and a channel.
  target_chat_id: 0 # Legacy single target; used only when target_chat_ids is empty. 0 replies to the submitting private chat.

profile_path: profile.md
log_level: info
max_attempts: 6 # Includes the first attempt; at most five retries.

reader:
  timeout: 20s
  max_bytes: 4194304
  max_content_chars: 20000
  max_links: 40
  cache_ttl: 24h
  allowed_non_public_cidrs: [] # e.g. [198.18.0.0/16] for a TUN fake-IP range.
  browser_fallback:
    enabled: false # Not implemented; true is rejected explicitly.
    engine: chromium # chromium | firefox | webkit; Chromium does not require Google Chrome.
    mode: launch # launch locally | connect via Playwright WebSocket | cdp (Chromium only).
    executable_path: "" # launch only; empty selects the Playwright-managed browser binary.
    endpoint: "" # connect: ws/wss; cdp: http/https/ws/wss. Use env if it contains credentials.
    headless: true # launch only; remote browser startup is controlled by its server.

agent:
  max_sources: 6
  max_supplemental: 2
  max_depth: 2
  max_iterations: 10
  timeout: 3m
  streaming: false # true sends stream=true and logs SSE chunks immediately at info level.
  # These are model-facing category labels; customize them to change the taxonomy. / 这些类别名会作为模型输出标签；按需调整即可。
  categories: [AI, 工程, 前端, 产品, 其他]

weekly:
  enabled: false # Enable after choosing your delivery target and time.
  timezone: Asia/Shanghai
  weekday: 1 # 0=Sunday, 1=Monday, ..., 6=Saturday.
  time: "09:00"
  max_input_chars: 120000 # Serialized weekly input cap; oversized input fails without dropping entries.
