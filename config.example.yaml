model:
  base_url: "" # Your Responses-compatible base URL, including /v1 when needed.
  name: "" # Model ID provided by your endpoint.
  context_window: 0 # Required: set the endpoint's total input + output token capacity.
  # Use KAGARI_MODEL_API_KEY for the credential.
  timeout: 60s
  max_output_tokens: 5000

storage:
  path: data/kagari-context.db

telegram:
  # Use KAGARI_TELEGRAM_TOKEN for the credential.
  allowed_user_ids: [] # Set exactly one positive Telegram user ID for personal mode.

personal:
  channel: telegram # telegram or weixin; switching requires a restart.
  timezone: Asia/Shanghai # IANA time zone used by schedules.
  task_concurrency: 4
  task_budget: 30m # Cumulative execution time per Task, including automatic planning; waiting is excluded.

profile_path: profile.md
log_level: info # Terminal level; file logs retain info+.

logging:
  directory: "" # Empty uses kagari.logs beside storage.path; full payloads are logged after known credentials are redacted.
  rotate_mib: 50
  max_total_mib: 1024
  retention_days: 7 # Rotated files are removed when they exceed this total-size cap or age limit.

reader:
  timeout: 20s
  max_bytes: 4194304
  max_content_chars: 20000
  max_links: 40
  allowed_non_public_cidrs: [] # e.g. [198.18.0.0/16] for a TUN fake-IP range.

browser:
  enabled: false # Exposes interactive browse_url; one isolated session per task stage.
  command: npx # Playwright MCP executable; no shell is used.
  args: [-y, "@playwright/mcp@0.0.82", --headless, --isolated, --codegen, none]

agent:
  max_sources: 6 # Shared budget for HTTP reads and valid browser actions per task stage.
  max_iterations: 10
  timeout: 3m
  streaming: false # Enables Responses SSE for task stages; per-chunk SSE logs are disabled.
